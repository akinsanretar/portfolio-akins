<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Page introuvable — Akins ANRETAR</title>
  <!-- Chemins absolus : GitHub Pages sert cette page quelle que soit l'adresse demandée -->
  <link rel="icon" type="image/png" sizes="32x32" href="/portfolio-akins/assets/images/favicon-32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Instrument+Serif:ital@1&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --ink: #111215; --muted: #5F6368; --page: #EAECEF; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      background: var(--page);
      color: var(--ink);
      font-family: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
      text-align: center;
    }
    main { max-width: 520px; }
    .logo {
      width: 72px; height: 72px; margin: 0 auto 28px; padding: 12px;
      border-radius: 20px; background: #fff; box-shadow: 0 18px 40px rgba(17, 18, 21, 0.06);
    }
    .logo img { width: 100%; height: 100%; object-fit: contain; }
    .code { font-family: "Bebas Neue", sans-serif; font-size: clamp(96px, 26vw, 160px); line-height: 0.85; letter-spacing: 0.02em; }
    h1 { font-size: 22px; margin: 18px 0 8px; }
    h1 em { font-family: "Instrument Serif", Georgia, serif; font-weight: 400; font-size: 1.2em; }
    p { color: var(--muted); font-size: 15px; line-height: 1.6; margin: 0 0 28px; }
    a.btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 12px 22px; border-radius: 9999px;
      background: var(--ink); color: #fff; text-decoration: none;
      font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
      transition: transform 0.2s ease;
    }
    a.btn:hover, a.btn:focus-visible { transform: translateY(-2px); }
    a.btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
  </style>
</head>

<body>
  <main>
    <div class="logo"><img src="/portfolio-akins/assets/images/Logo_AKINS.png" alt="Logo Akins ANRETAR"></div>
    <div class="code" aria-hidden="true">404</div>
    <h1>Cette page est <em>introuvable.</em></h1>
    <p>Le lien est peut-être ancien ou mal saisi. Le portfolio, lui, est toujours là.</p>
    <a class="btn" href="/portfolio-akins/">Retour au portfolio <span aria-hidden="true">→</span></a>
  </main>
</body>

</html>
